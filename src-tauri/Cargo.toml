[package]
name = "wumpa"
version = "0.1.1"
description = "Wumpa - fast, free, offline PDF editor"
authors = ["Wumpa contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wumpa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.45.0"
tauri-plugin-dialog = "2.8.1"
flate2 = "1.1.10"
base64 = "0.23.1"
tauri-plugin-window-state = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.25", default-features = false }
getrandom = "0.4"
# password protection
sha2 = "0.10"
# page composer: text shaping, bidi, font subsetting
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-bidi = "0.3"
unicode-script = "0.5"
subsetter = "0.2"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
